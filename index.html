<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>GAME LIST — 내 Switch 게임 라이브러리</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Nintendo Switch / Switch2 개인 게임 라이브러리 관리 앱">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GAME LIST">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ MOBILE APP BAR ============ -->
  <header class="appbar mobile-only">
    <div class="appbar-row">
      <h1 class="appbar-title">GAME LIST</h1>
      <button class="icon-btn" id="btnSearch" aria-label="검색">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="btnFullscreen" aria-label="전체화면">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="icon-btn hide" id="btnInstall" aria-label="앱 설치">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
    </div>
    <div class="search-row" id="searchRow">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="게임명 검색 (한글/영문/숫자)" autocomplete="off">
      </div>
      <button class="search-cancel" id="btnSearchCancel">취소</button>
    </div>
    <div class="hero-card">
      <div class="hero-ring" id="heroRing">
        <div class="hero-ring-inner"><span id="heroPct">0%</span></div>
      </div>
      <div class="hero-stats">
        <div class="hero-badges">
          <span class="badge total"><b id="statTotal">0</b>전체</span>
          <span class="badge done"><b id="statDone">0</b>클리어</span>
          <span class="badge todo"><b id="statTodo">0</b>미클리어</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ DESKTOP HEADER ============ -->
  <header class="pc-header desktop-only">
    <div class="pc-header-row">
      <h1 class="pc-title">GAME LIST</h1>
      <div class="pc-summary" id="summaryBarDesktop"></div>
      <div class="pc-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="pcSearchInput" type="text" placeholder="게임명 검색">
      </div>
      <div class="pc-actions">
        <button class="pill-btn" id="pcBtnSort">번호순</button>
        <button class="pill-btn" id="pcBtnBackup">백업</button>
        <button class="pill-btn" id="pcBtnRestore">복원</button>
        <button class="pill-btn hide" id="pcBtnInstall">앱 설치</button>
      </div>
    </div>
  </header>

  <main>

    <!-- ============ MOBILE: 전체목록 ============ -->
    <section class="screen mobile-only" id="screen-list">
      <div class="chip-row" id="chipRowList"></div>
      <div class="tool-row">
        <div class="seg" id="segListStatus">
          <button data-v="all" class="active">전체</button>
          <button data-v="todo">미클리어</button>
          <button data-v="done">클리어</button>
        </div>
        <select class="sort-select" id="sortSelectList">
          <option value="number">번호순</option>
          <option value="title">가나다순</option>
        </select>
      </div>
      <div class="result-count" id="listResultCount" style="padding:8px 14px 0; color:var(--text-faint); font-size:12px;"></div>
      <div id="listContainer"></div>
      <div class="empty-state" id="listEmpty"><div class="big">🎮</div>조건에 맞는 게임이 없어요</div>
    </section>

    <!-- ============ MOBILE: 카테고리 ============ -->
    <section class="screen mobile-only" id="screen-categories">
      <div class="cat-grid" id="catGrid"></div>
      <div class="tool-panel">
        <div class="label">데이터 관리</div>
        <div class="actions">
          <button class="pill-btn" id="btnBackup">백업 (JSON 내보내기)</button>
          <button class="pill-btn" id="btnRestore">복원 (JSON 불러오기)</button>
          <button class="pill-btn danger" id="btnReset">클리어/즐겨찾기 초기화</button>
        </div>
        <input type="file" id="restoreFile" accept="application/json" class="visually-hidden">
      </div>
    </section>

    <!-- ============ MOBILE: 클리어 ============ -->
    <section class="screen mobile-only" id="screen-cleared">
      <div class="tool-row">
        <div class="seg" id="segClearedStatus">
          <button data-v="todo" class="active">미클리어</button>
          <button data-v="done">클리어</button>
        </div>
        <select class="sort-select" id="sortSelectCleared">
          <option value="number">번호순</option>
          <option value="title">가나다순</option>
        </select>
      </div>
      <div class="result-count" id="clearedResultCount" style="padding:8px 14px 0; color:var(--text-faint); font-size:12px;"></div>
      <div id="clearedContainer"></div>
      <div class="empty-state" id="clearedEmpty"><div class="big">✅</div>해당하는 게임이 없어요</div>
    </section>

    <!-- ============ MOBILE: 즐겨찾기 ============ -->
    <section class="screen mobile-only" id="screen-favorites">
      <div class="tool-row">
        <select class="sort-select" id="sortSelectFav">
          <option value="number">번호순</option>
          <option value="title">가나다순</option>
        </select>
        <div class="result-count" id="favResultCount"></div>
      </div>
      <div id="favContainer"></div>
      <div class="empty-state" id="favEmpty"><div class="big">⭐</div>즐겨찾기한 게임이 없어요<br>목록에서 별표를 눌러보세요</div>
    </section>

    <!-- ============ MOBILE: 검색 결과 오버레이 ============ -->
    <section class="screen mobile-only" id="screen-search">
      <div class="result-count" id="searchResultCount" style="padding:12px 14px 0; color:var(--text-faint); font-size:12px;"></div>
      <div id="searchContainer"></div>
      <div class="empty-state" id="searchEmpty"><div class="big">🔍</div>검색 결과가 없어요</div>
    </section>

    <!-- ============ DESKTOP: 카테고리 그리드 ============ -->
    <section class="desktop-only" id="pc-content">
      <div class="pc-toolbar"></div>
      <div class="pc-grid" id="pcGrid"></div>
    </section>

  </main>

  <!-- ============ BOTTOM NAV (mobile) ============ -->
  <nav class="bottom-nav mobile-only" id="bottomNav">
    <button class="nav-btn active" data-screen="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>전체목록</span>
    </button>
    <button class="nav-btn" data-screen="categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>카테고리</span>
    </button>
    <button class="nav-btn" data-screen="cleared">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>클리어</span>
    </button>
    <button class="nav-btn" data-screen="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>즐겨찾기</span>
    </button>
  </nav>

  <button class="top-btn mobile-only" id="btnTop" aria-label="맨 위로">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>

</div>

<input type="file" id="pcRestoreFile" accept="application/json" class="visually-hidden">

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
